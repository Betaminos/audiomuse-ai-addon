name: Build ARM64 add-on image

on:
  push:
    branches: [main, master]
    paths:
      - "audiomuse-ai/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    # Native ARM64 runners are free for PUBLIC repositories.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name (must be lowercase)
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}/audiomuse-ai" >> "$GITHUB_ENV"

      - name: Read add-on version
        run: echo "ADDON_VERSION=$(jq -r .version audiomuse-ai/config.json)" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: audiomuse-ai
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE }}:${{ env.ADDON_VERSION }}
            ghcr.io/${{ env.IMAGE }}:latest
