name: Build ARM64 add-on image

on:
  push:
    branches: [main, master]
    paths:
      - "audiomuse-ai/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  # Serialize builds: a newer push cancels the in-flight run (which by
  # design has not committed its version yet), so two runs can never
  # both compute the same next version and race each other.
  group: addon-build
  cancel-in-progress: true

jobs:
  build:
    # Native ARM64 runners are free for PUBLIC repositories.
    runs-on: ubuntu-24.04-arm
    # Hard stop for a wedged build instead of burning runner time.
    timeout-minutes: 30
    permissions:
      contents: write   # push the version-bump commit back to the branch
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute image name (must be lowercase)
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}/audiomuse-ai" >> "$GITHUB_ENV"

      - name: Bump packaging suffix
        run: |
          CURRENT=$(jq -r .version audiomuse-ai/config.json)
          UPSTREAM="${CURRENT%%-*}"
          SUFFIX="${CURRENT#*-}"
          case "$SUFFIX" in ''|*[!0-9]*) SUFFIX=0 ;; esac
          NEW="$UPSTREAM-$((SUFFIX + 1))"
          jq --arg v "$NEW" '.version = $v' audiomuse-ai/config.json > /tmp/config.json
          mv /tmp/config.json audiomuse-ai/config.json
          echo "ADDON_VERSION=$NEW" >> "$GITHUB_ENV"
          echo "Publishing add-on version $NEW"

      # The gha cache backend below REQUIRES buildx's docker-container driver.
      # Without this step buildx uses the plain docker driver, which cannot
      # export a build cache, and the build dies within a second with
      # "Cache export is not supported for the docker driver" (this is
      # exactly what failed run #7 on 2026-10-13 did).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: audiomuse-ai
          platforms: linux/arm64
          push: true
          # Reuse Docker layers between builds (GitHub's cache service): the
          # apt layer and the big .deb download layer are keyed on the
          # Dockerfile contents and the AUDIOMUSE_VERSION ARG, so packaging
          # suffix builds skip re-downloading everything.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ env.IMAGE }}:${{ env.ADDON_VERSION }}
            ghcr.io/${{ env.IMAGE }}:latest

      - name: Job summary
        run: |
          {
            echo "### Published add-on version \`${ADDON_VERSION}\`"
            echo "- Image: \`ghcr.io/${IMAGE}:${ADDON_VERSION}\`"
            echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Commit the bumped config.json only after the image is safely in
      # GHCR, so the repo never advertises a version that cannot be pulled.
      # NOTE: do the git add/commit first and push last — a rebase/pull
      # here would refuse to run because the tree has uncommitted changes.
      - name: Commit bumped version back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audiomuse-ai/config.json
          git commit -m "chore: publish add-on version $ADDON_VERSION [skip ci]"
          if git push origin "HEAD:${{ github.ref_name }}"; then
            echo "Version commit pushed."
          else
            echo "Branch moved during the build; version not committed (image $ADDON_VERSION is safely in GHCR)."
          fi
